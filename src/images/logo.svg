<svg width="264" height="60" viewBox="0 0 264 60" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="DGC Biuro Rachunkowe">
  <!-- Znak DGC zbudowany geometrycznie (litery to sciezki, nie <text>),
       wiec renderuje sie identycznie niezaleznie od dostepnosci fontu.
       Zielen z palety #0D4444, podpis w kolorze tekstu marki #0D4444. -->
  <g stroke="#0D4444" stroke-width="12" fill="none">
    <!-- D -->
    <path d="M12 6 V 46"/>
    <path d="M18 12 A 14 14 0 0 1 18 40"/>
    <!-- G: otwarcie w prawym gornym rogu, poprzeczka w polowie wysokosci -->
    <path d="M80.72 17 A 14 14 0 1 0 83.99 26.49"/>
    <!-- C -->
    <path d="M133.03 17.38 A 14 14 0 1 0 133.03 34.62"/>
  </g>
  <rect x="68" y="20" width="16" height="12" fill="#0D4444"/>

  <!-- Podpis -->
  <text x="154" y="24" fill="#0D4444" font-family="Poppins, 'Helvetica Neue', Helvetica, Arial, sans-serif"
        font-size="13" font-weight="700" letter-spacing="1.1">BIURO</text>
  <text x="154" y="42" fill="#0D4444" font-family="Poppins, 'Helvetica Neue', Helvetica, Arial, sans-serif"
        font-size="13" font-weight="700" letter-spacing="1.1">RACHUNKOWE</text>
</svg>
